<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İyi ki Doğdun Berat 🦁</title>

<style>
body{
  margin:0;
  height:100vh;
  background:radial-gradient(circle,#3b0000,#000);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:Georgia,serif;
}

/* Sahne ışığı */
.light{
  position:absolute;
  width:300px;
  height:300px;
  background:radial-gradient(circle,rgba(255,200,0,.4),transparent 70%);
  filter:blur(20px);
}

/* Parşömen */
.scroll{
  width:300px;
  height:180px;
  background:linear-gradient(#f9f2dc,#e6d3a3);
  border-radius:12px;
  position:relative;
  box-shadow:0 20px 40px rgba(0,0,0,.8);
  animation:shake 0.6s infinite;
  overflow:hidden;
}

/* Güçlü titreme */
@keyframes shake{
  0%{transform:rotate(0deg)}
  25%{transform:rotate(1.5deg)}
  50%{transform:rotate(0deg)}
  75%{transform:rotate(-1.5deg)}
}

/* Mühür */
.seal{
  position:absolute;
  width:80px;
  height:80px;
  background:#a5002d;
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:36px;
  color:#ffcc00;
  z-index:5;
  box-shadow:0 0 20px #ffcc00;
  transition:1s;
}

/* İç kağıt */
.paper{
  position:absolute;
  width:100%;
  height:360px;
  top:140px;
  left:0;
  background:linear-gradient(#fffdf2,#e8d9a8);
  padding:20px;
  box-sizing:border-box;
  text-align:center;
  transition:2s cubic-bezier(.2,1,.2,1);
}

/* Açılınca */
.open{
  animation:none;
}
.open .seal{
  transform:translate(-50%,-50%) scale(0);
}
.open .paper{
  top:-180px;
}

h1{
  color:#7b001a;
  margin:0;
}
p{
  color:#400000;
  line-height:1.6;
  font-size:17px;
}
</style>
</head>

<body>

<div class="light"></div>

<div class="scroll" id="scroll">
  <div class="seal">🦁</div>

  <div class="paper">
    <h1>🌹 İyi ki Doğdun Berat 🌹</h1>
    <p>
      Doğum günün kutlu olsun Beratım 🎉<br>
      Yeni yaşında bol mutluluk, sağlık ve başarı diliyorum.<br>
      Pes’te yine herkesi çakmaya devam 😏<br>
      İyi ki varsın 🦁❤️
    </p>
  </div>
</div>

<script>
let opened=false;

window.addEventListener("devicemotion", e=>{
  let a=e.accelerationIncludingGravity;
  let power=Math.abs(a.x)+Math.abs(a.y)+Math.abs(a.z);

  if(power>25 && !opened){
    document.getElementById("scroll").classList.add("open");
    opened=true;
  }
});
</script>

</body>
</html>
