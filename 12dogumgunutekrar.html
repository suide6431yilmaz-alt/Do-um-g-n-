<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İyiki Doğdun Berat</title>

<style>
body{
  margin:0;
  height:100vh;
  background:linear-gradient(180deg,#8b001f,#ffcc00);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Georgia,serif;
  overflow:hidden;
}

/* Konfeti */
.confetti{
  position:absolute;
  width:10px;
  height:10px;
  border-radius:50%;
  animation:fall linear infinite;
}
@keyframes fall{
  from{transform:translateY(-40px);}
  to{transform:translateY(110vh);}
}

/* Mektup */
.letter{
  width:300px;
  height:200px;
  background:#fffdf2;
  border-radius:8px;
  box-shadow:0 15px 40px rgba(0,0,0,.5);
  position:relative;
  cursor:pointer;
  animation:shake 0.7s infinite;
  transition:1s;
}

/* Güçlü titreme */
@keyframes shake{
  0%{transform:rotate(0deg)}
  25%{transform:rotate(1.5deg)}
  50%{transform:rotate(0deg)}
  75%{transform:rotate(-1.5deg)}
}

/* Mühür */
.seal{
  position:absolute;
  width:42px;
  height:42px;
  background:#a5002d;
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:20px;
  color:#ffcc00;
  z-index:5;
  transition:.8s;
}

/* İç kağıt */
.paper{
  position:absolute;
  width:100%;
  height:100%;
  padding:15px;
  box-sizing:border-box;
  text-align:center;
  opacity:0;
  transition:1s;
}

/* Açılınca */
.open{
  animation:none;
  transform:scale(1.2);
}

.open .seal{
  transform:translate(-50%,-50%) scale(0);
}

.open .paper{
  opacity:1;
}

/* Başlık */
h1{
  font-size:26px;
  color:#a5002d;
  margin-top:0;
}

/* Yazı */
p{
  color:#400000;
  font-size:16px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="letter" onclick="openLetter()">
  <div class="seal">🌹</div>
  <div class="paper">
    <h1>🌹 İyiki Doğdun Berat 🌹</h1>
    <p>
      Doğum günün kutlu olsun Beratım 🎉<br>
      Yeni yaşında bol mutluluk ve başarı diliyorum.<br>
      Pes’te herkesi yine çakmaya devam 😏<br>
      İyi ki varsın 🦁❤️
    </p>
  </div>
</div>

<script>
let opened=false;
function openLetter(){
  const l=document.querySelector(".letter");
  l.classList.add("open");

  if(!opened){
    opened=true;
    for(let i=0;i<40;i++){
      const c=document.createElement("div");
      c.className="confetti";
      c.style.left=Math.random()*100+"vw";
      c.style.background=["#ffcc00","#ff0033","#fff","#ffa500"][Math.floor(Math.random()*4)];
      c.style.animationDuration=(Math.random()*3+2)+"s";
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),5000);
    }
  }
}
</script>

</body>
</html>
