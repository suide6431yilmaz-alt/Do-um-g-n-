<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>İyi ki Doğdun Berat 🦁</title>

<style>
body{
    margin:0;
    height:100vh;
    background: linear-gradient(135deg, #a5002d, #ffcc00);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family: 'Georgia', serif;
}

/* Zarf */
.envelope{
    width:350px;
    height:220px;
    background:#8b001f;
    position:relative;
    cursor:pointer;
    box-shadow:0 0 30px rgba(0,0,0,0.4);
    border-radius:10px;
}

/* Kapak */
.flap{
    position:absolute;
    width:0;
    height:0;
    border-left:175px solid transparent;
    border-right:175px solid transparent;
    border-bottom:110px solid #ffcc00;
    top:0;
    left:0;
    transform-origin:top;
    transition:1s;
    z-index:3;
}

/* İç kağıt */
.letter{
    position:absolute;
    width:90%;
    height:90%;
    background:white;
    top:10px;
    left:5%;
    padding:20px;
    box-sizing:border-box;
    transform: translateY(120px);
    transition:1s;
    border-radius:10px;
    overflow:hidden;
}

.open .flap{
    transform: rotateX(180deg);
}

.open .letter{
    transform: translateY(-80px);
}

/* Yazı */
h1{
    color:#a5002d;
    text-align:center;
}

p{
    font-size:18px;
    line-height:1.5;
}

/* Galatasaray logosu (aslan efekti) */
.lion{
    position:absolute;
    top:-60px;
    right:-60px;
    font-size:100px;
    opacity:0.2;
}
</style>
</head>

<body>

<div class="envelope" onclick="openLetter()">
    <div class="flap"></div>

    <div class="letter">
        <div class="lion">🦁</div>
        <h1>🌹İyiki Doğdun Berat🌹</h1>
        <p>
        Doğum günün kutlu olsun Beratım🌹.<br>
        Yeni yılda ve yaşında mutluluklar dilerim.<br>
        Pesde bu senede çakmaya devam.<br>
        Seviliyorsun🌹🌹🌹
        </p>
    </div>
</div>

<script>
function openLetter(){
    document.querySelector(".envelope").classList.toggle("open");
}
</script>

</body>
</html>
