<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İyi ki Doğdun Berat 🦁</title>

<style>
body{
  margin:0;
  height:100vh;
  background: linear-gradient(180deg,#a5002d,#ffcc00);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family: "Georgia", serif;
}

/* Zarf */
.envelope{
  width:90vw;
  max-width:360px;
  height:220px;
  background:#8b001f;
  position:relative;
  border-radius:15px;
  cursor:pointer;
  box-shadow:0 15px 40px rgba(0,0,0,0.5);
  overflow:hidden;
}

/* Üst kapak */
.flap{
  position:absolute;
  width:100%;
  height:100%;
  background:#ffcc00;
  clip-path: polygon(0 0, 100% 0, 50% 50%);
  top:0;
  left:0;
  transform-origin:top;
  transition:1s;
  z-index:3;
}

/* Kağıt */
.paper{
  position:absolute;
  width:90%;
  height:300px;
  background:#fffdf2;
  top:30px;
  left:5%;
  border-radius:10px;
  padding:20px;
  box-sizing:border-box;
  transform: translateY(200px);
  transition:1s;
  z-index:2;
}

/* Açılınca */
.open .flap{
  transform: rotateX(180deg);
}

.open .paper{
  transform: translateY(-140px);
}

/* Yazılar */
h1{
  color:#a5002d;
  text-align:center;
  font-size:28px;
  margin-top:0;
}

p{
  font-size:18px;
  text-align:center;
  line-height:1.6;
  color:#400000;
}

/* Aslan */
.lion{
  position:absolute;
  bottom:-15px;
  right:-15px;
  font-size:80px;
  opacity:0.15;
}
</style>
</head>

<body>

<div class="envelope" onclick="openLetter()">
  <div class="flap"></div>

  <div class="paper">
    <div class="lion">🦁</div>
    <h1>🌹İyiki Doğdun Berat🌹</h1>
    <p>
      Doğum günün kutlu olsun Beratım🌹<br>
      Yeni yılda ve yaşında mutluluklar dilerim.<br>
      Pesde bu senede çakmaya devam 😏<br>
      Seviliyorsun 🌹🌹🌹
    </p>
  </div>
</div>

<script>
function openLetter(){
  document.querySelector(".envelope").classList.toggle("open");
}
</script>

</body>
</html>
