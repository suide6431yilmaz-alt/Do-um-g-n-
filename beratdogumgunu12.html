<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İyi ki Doğdun Berat 🦁</title>

<style>
body{
  margin:0;
  height:100vh;
  background: linear-gradient(180deg,#7b001a,#ffcc00);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family: "Georgia", serif;
  overflow:hidden;
}

/* Konfeti */
.confetti{
  position:absolute;
  width:10px;
  height:10px;
  background:red;
  animation: fall 4s linear infinite;
}

@keyframes fall{
  from{transform: translateY(-50px) rotate(0deg);}
  to{transform: translateY(110vh) rotate(360deg);}
}

/* Zarf */
.envelope{
  width:90vw;
  max-width:360px;
  height:220px;
  background:#8b001f;
  position:relative;
  border-radius:15px;
  cursor:pointer;
  box-shadow:0 20px 50px rgba(0,0,0,0.6);
  overflow:hidden;
  transition:0.5s;
}

.envelope:hover{
  transform: scale(1.03);
}

/* Üst kapak */
.flap{
  position:absolute;
  width:100%;
  height:100%;
  background:#ffcc00;
  clip-path: polygon(0 0, 100% 0, 50% 50%);
  top:0;
  left:0;
  transform-origin:top;
  transition:1s ease-in-out;
  z-index:3;
}

/* Kağıt */
.paper{
  position:absolute;
  width:90%;
  height:320px;
  background:#fffdf2;
  top:30px;
  left:5%;
  border-radius:12px;
  padding:20px;
  box-sizing:border-box;
  transform: translateY(220px);
  transition:1.2s cubic-bezier(.2,1,.2,1);
  z-index:2;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* Açılınca */
.open .flap{
  transform: rotateX(180deg);
}

.open .paper{
  transform: translateY(-160px);
}

/* Yazılar */
h1{
  color:#a5002d;
  text-align:center;
  font-size:28px;
  margin-top:0;
}

p{
  font-size:18px;
  text-align:center;
  line-height:1.6;
  color:#400000;
}

/* Aslan */
.lion{
  position:absolute;
  bottom:-10px;
  right:-10px;
  font-size:80px;
  opacity:0.15;
}
</style>
</head>

<body>

<div class="envelope" onclick="openLetter()">
  <div class="flap"></div>

  <div class="paper">
    <div class="lion">🦁</div>
    <h1>🌹 İyi ki Doğdun Berat 🌹</h1>
    <p>
      Doğum günün kutlu olsun Beratım 🎉<br>
      Yeni yaşında bol mutluluk, sağlık ve başarı diliyorum.<br>
      Pes’te yine herkesi çakmaya devam 😏<br>
      İyi ki varsın 🦁❤️
    </p>
  </div>
</div>

<!-- Sesler -->
<audio id="openSound" src="https://assets.mixkit.co/sfx/preview/mixkit-paper-slide-1530.mp3"></audio>
<audio id="celebrateSound" src="https://assets.mixkit.co/sfx/preview/mixkit-small-crowd-cheer-364.mp3"></audio>

<script>
let opened = false;

function openLetter(){
  const env = document.querySelector(".envelope");
  const openSound = document.getElementById("openSound");
  const celebrate = document.getElementById("celebrateSound");

  env.classList.toggle("open");

  if(!opened){
    openSound.play();
    celebrate.play();
    makeConfetti();
    opened = true;
  }
}

/* Konfeti oluştur */
function makeConfetti(){
  for(let i=0;i<40;i++){
    const c = document.createElement("div");
    c.classList.add("confetti");
    c.style.left = Math.random()*100+"vw";
    c.style.background = ["#ffcc00","#ff0033","#ffffff","#ffa500"][Math.floor(Math.random()*4)];
    c.style.animationDuration = (Math.random()*3+2)+"s";
    document.body.appendChild(c);

    setTimeout(()=>c.remove(),5000);
  }
}
</script>

</body>
</html>
