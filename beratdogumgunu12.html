<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İyi ki Doğdun Berat 🦁</title>

<style>
body{
  margin:0;
  height:100vh;
  background: linear-gradient(180deg,#8b001f,#ffcc00);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family: Georgia, serif;
  overflow:hidden;
}

/* Kart */
.card{
  width:90vw;
  max-width:360px;
  height:220px;
  background:#8b001f;
  border-radius:20px;
  position:relative;
  cursor:pointer;
  box-shadow:0 20px 40px rgba(0,0,0,.6);
  overflow:hidden;
  transition:.4s;
}
.card:hover{transform:scale(1.04);}

/* Kapaklar */
.left,.right{
  position:absolute;
  width:50%;
  height:100%;
  top:0;
  background:#ffcc00;
  z-index:2;
  transition:1s;
}
.left{left:0;border-radius:20px 0 0 20px;}
.right{right:0;border-radius:0 20px 20px 0;}

.open .left{transform:translateX(-100%);}
.open .right{transform:translateX(100%);}

/* Mektup */
.letter{
  position:absolute;
  width:90%;
  height:320px;
  background:#fffdf2;
  left:5%;
  top:20px;
  border-radius:12px;
  padding:20px;
  box-sizing:border-box;
  transform:scale(.3);
  opacity:0;
  transition:1.2s cubic-bezier(.2,1,.2,1);
  z-index:1;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.open .letter{
  transform:scale(1) translateY(-120px);
  opacity:1;
}

/* Yazı */
h1{color:#a5002d;text-align:center;margin:0;}
p{color:#400000;text-align:center;font-size:17px;line-height:1.6;}

.lion{
  position:absolute;
  bottom:-10px;
  right:-10px;
  font-size:80px;
  opacity:.15;
}

/* Konfeti */
.confetti{
  position:absolute;
  width:10px;
  height:10px;
  border-radius:50%;
  animation:fall linear infinite;
}
@keyframes fall{
  from{transform:translateY(-50px) rotate(0deg);}
  to{transform:translateY(110vh) rotate(360deg);}
}
</style>
</head>

<body>

<div class="card" onclick="openCard()">
  <div class="left"></div>
  <div class="right"></div>

  <div class="letter">
    <div class="lion">🦁</div>
    <h1>🌹 İyi ki Doğdun Berat 🌹</h1>
    <p>
      Doğum günün kutlu olsun Beratım 🎉<br>
      Yeni yaşında bol mutluluk, sağlık ve başarı diliyorum.<br>
      Pes’te yine herkesi çakmaya devam 😏<br>
      İyi ki varsın 🦁❤️
    </p>
  </div>
</div>

<!-- Ses -->
<audio id="openSound" preload="auto">
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5b0b2c1c9c.mp3?filename=paper-slide-103090.mp3">
</audio>
<audio id="cheerSound" preload="auto">
  <source src="https://cdn.pixabay.com/download/audio/2022/10/26/audio_0d7c77a8c4.mp3?filename=success-fanfare-trumpets-6185.mp3">
</audio>

<script>
let opened=false;
function openCard(){
  const card=document.querySelector(".card");
  card.classList.toggle("open");

  document.getElementById("openSound").play();

  if(!opened){
    setTimeout(()=>document.getElementById("cheerSound").play(),800);
    confetti();
    opened=true;
  }
}

function confetti(){
  for(let i=0;i<50;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=["#ffcc00","#ff0033","#fff","#ffa500"][Math.floor(Math.random()*4)];
    c.style.animationDuration=(Math.random()*3+2)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5000);
  }
}
</script>

</body>
</html>
