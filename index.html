<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İyi Ki Doğdun Berat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #ffe4ec, #ffd1dc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        .envelope {
            width: 320px;
            height: 220px;
            background: #f8b7c8;
            position: relative;
            cursor: pointer;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            border-radius: 6px;
            transition: transform 0.5s;
        }

        .envelope:hover {
            transform: scale(1.03);
        }

        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f29ab3;
            clip-path: polygon(0 0, 100% 0, 50% 55%);
            transform-origin: top;
            transition: transform 1s;
            z-index: 3;
        }

        .letter {
            position: absolute;
            top: 10px;
            left: 10px;
            width: calc(100% - 20px);
            height: calc(100% - 20px);
            background: #fff;
            border-radius: 4px;
            padding: 20px;
            text-align: center;
            transform: translateY(100%);
            transition: transform 1s;
            z-index: 2;
            overflow-y: auto;
        }

        .letter h1 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            margin-bottom: 15px;
            color: #d94c77;
        }

        .letter p {
            font-size: 15px;
            line-height: 1.7;
            color: #444;
        }

        .signature {
            margin-top: 20px;
            font-style: italic;
            color: #c94a72;
            font-size: 16px;
        }

        .open .flap {
            transform: rotateX(180deg);
        }

        .open .letter {
            transform: translateY(0);
        }

        .hint {
            position: absolute;
            bottom: 30px;
            font-size: 14px;
            color: #a94460;
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="envelope" onclick="openLetter()">
    <div class="flap"></div>
    <div class="letter">
        <h1>Doğum Günün Kutlu Olsun Beratım 🌹</h1>
        <p>
            Yeni yılda ve yaşında mutluluklar diliyorum.  
            İnşallah nice senelere.  
            PES’de yeni senende ve yaşında da çakmaya devam.
        </p>

        <div class="signature">
            🌹 Sevgilerle Said 🌹
        </div>
    </div>
</div>

<div class="hint">Mektuba dokun ✉️</div>

<script>
    function openLetter() {
        document.querySelector('.envelope').classList.add('open');
        document.querySelector('.hint').style.display = 'none';
    }
</script>

</body>
</html>
