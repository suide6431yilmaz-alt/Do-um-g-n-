<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sürpriz 🎁</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #1f2933, #3e4c59);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: #fff;
}

.container {
    text-align: center;
    padding: 20px;
}

h1 {
    font-size: 22px;
    margin-bottom: 20px;
}

button {
    padding: 14px 28px;
    font-size: 17px;
    border: none;
    border-radius: 25px;
    background: #f59e0b;
    color: #000;
    cursor: pointer;
    transition: transform 0.2s;
}

button:hover {
    transform: scale(1.05);
}

/* Zarf */
.envelope {
    width: 260px;
    height: 170px;
    background: #f59e0b;
    margin: 30px auto;
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    display: none;
}

.envelope::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: #d97706;
    clip-path: polygon(0 0, 100% 0, 50% 60%);
    transform-origin: top;
    transition: transform 1s;
}

.envelope.open::before {
    transform: rotateX(180deg);
}

/* Mektup */
.letter {
    display: none;
    background: #f9fafb;
    color: #111;
    padding: 25px;
    border-radius: 12px;
    max-width: 320px;
    margin: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    text-align: left;
    line-height: 1.6;
}

/* Konfeti */
.confetti {
    position: fixed;
    width: 8px;
    height: 8px;
    background: red;
    animation: fall 3s linear forwards;
}

@keyframes fall {
    from {transform: translateY(-50px) rotate(0deg);}
    to {transform: translateY(100vh) rotate(360deg);}
}
</style>
</head>

<body>

<div class="container">
    <h1 id="introText">Aç bakalım bu benden bir sürpriz bebeğim 🤪</h1>
    <button id="openBtn" onclick="openEnvelope()">Aç 🎁</button>

    <div class="envelope" id="envelope"></div>

    <div class="letter" id="letter">
        <p id="typedText"></p>
        <p style="text-align:center; font-weight:bold; margin-top:20px;">
            🌹Sevgilerle Said🌹
        </p>
    </div>
</div>

<audio id="paperSound">
    <source src="https://assets.mixkit.co/sfx/preview/mixkit-paper-opening-1518.mp3" type="audio/mpeg">
</audio>

<script>
const text = `Doğum günün kutlu olsun Beratım 🌹

Yeni yılda ve yaşında mutluluklar diliyorum.
İnşallah nice senelere.
Pes de yeni senende ve yaşında da çakmaya devam 😄`;

let index = 0;

function openEnvelope() {
    document.getElementById("openBtn").style.display = "none";
    document.getElementById("introText").style.display = "none";

    const env = document.getElementById("envelope");
    env.style.display = "block";
    env.classList.add("open");

    document.getElementById("paperSound").play();
    createConfetti();

    setTimeout(() => {
        env.style.display = "none";
        document.getElementById("letter").style.display = "block";
        typeWriter();
    }, 1200);
}

function typeWriter() {
    if (index < text.length) {
        document.getElementById("typedText").innerHTML += text.charAt(index);
        index++;
        setTimeout(typeWriter, 40);
    }
}

function createConfetti() {
    for (let i = 0; i < 40; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.background = ["#f59e0b","#22c55e","#3b82f6","#ef4444"][Math.floor(Math.random()*4)];
        c.style.animationDuration = (2 + Math.random() * 2) + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 3000);
    }
}
</script>

</body>
</html>
