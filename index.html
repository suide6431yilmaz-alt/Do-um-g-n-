<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İyi ki Doğdun Berat 🎉</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffecd2, #fcb69f);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  background: white;
  width: 90%;
  max-width: 380px;
  padding: 25px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h1 {
  color: #ff6b6b;
  margin-bottom: 15px;
}

.intro {
  color: #555;
  font-size: 15px;
  margin-bottom: 20px;
}

button {
  background: #ff6b6b;
  color: white;
  border: none;
  padding: 12px 22px;
  border-radius: 25px;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #ff4757;
}

.envelope {
  margin-top: 25px;
  perspective: 1000px;
  display: none;
}

.letter {
  background: #fffaf0;
  border-radius: 12px;
  padding: 20px;
  transform: rotateX(-90deg);
  transform-origin: top;
  transition: transform 1s;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.letter.open {
  transform: rotateX(0deg);
}

.letter p {
  font-size: 15px;
  line-height: 1.6;
  color: #444;
}
</style>
</head>

<body>

<div class="container">
  <h1>🎂 İyi ki Doğdun!</h1>

  <p class="intro">
    Senin için küçük ama anlamlı bir şey hazırladım.<br>
    Hazırsan mektubu açabilirsin 🙂
  </p>

  <button onclick="openLetter()">📜 Mektubu Aç</button>

  <div class="envelope" id="envelope">
    <div class="letter" id="letter">
      <p>
        Doğum günün kutlu olsun Beratım 🌹<br><br>
        Yeni yılda ve yaşında mutluluklar dilerim.<br>
        Pesde bu senede çakıcam 😄<br><br>
        Sevgilerle 🌹🌹🌹
      </p>
    </div>
  </div>
</div>

<script>
function openLetter() {
  document.getElementById("envelope").style.display = "block";
  setTimeout(() => {
    document.getElementById("letter").classList.add("open");
  }, 100);
}
</script>

</body>
</html>
